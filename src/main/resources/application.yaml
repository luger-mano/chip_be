spring:
  application:
    name: chip

  datasource:
    url: jdbc:postgresql://localhost:5432/chip
    username: root
    password: chip_enterprise
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    repair-on-migrate: true
    encoding: UTF-8
    lock-retry-count: 10